services:
  at-mesh:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: at-mesh
    restart: unless-stopped
    env_file: .env
    volumes:
      - atmesh-data:/data
      - ./keys:/data/keys:ro
      - ./clients.yaml:/data/clients.yaml:ro
    ports:
      - "127.0.0.1:9091:9091"

volumes:
  atmesh-data:
