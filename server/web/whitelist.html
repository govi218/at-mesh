<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>at-mesh Admin</title>
	<style>
		:root { color-scheme: dark; }
		body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #eee; margin: 0; padding: 2rem; }
		h1 { font-size: 1.5rem; }
		table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
		th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #333; }
		th { color: #aaa; font-weight: normal; font-size: 0.875rem; }
		input, textarea { width: 100%; padding: 0.5rem; border: 1px solid #333; border-radius: 4px; background: #0f3460; color: #eee; font-size: 0.875rem; box-sizing: border-box; }
		input:focus, textarea:focus { outline: none; border-color: #e94560; }
		button { padding: 0.5rem 1rem; border: none; border-radius: 4px; background: #e94560; color: #fff; cursor: pointer; font-size: 0.875rem; }
		button:hover { background: #c73e54; }
		.btn-sm { padding: 0.25rem 0.5rem; font-size: 0.75rem; }
		.btn-danger { background: #444; }
		.btn-danger:hover { background: #c73e54; }
		.form-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; align-items: flex-end; }
		.form-row > div { flex: 1; }
		.form-row label { display: block; font-size: 0.75rem; color: #aaa; margin-bottom: 0.25rem; }
		.actions { display: flex; gap: 0.25rem; }
		.edit-row { background: #16213e; }
		.logout { position: absolute; top: 2rem; right: 2rem; }
		.info-icon { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border: 1px solid #aaa; border-radius: 50%; font-size: 0.7rem; color: #aaa; cursor: help; position: relative; vertical-align: middle; margin-left: 0.25rem; }
		.info-icon:hover .info-tooltip { display: block; }
		.info-tooltip { display: none; position: absolute; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: #0f3460; border: 1px solid #333; border-radius: 4px; padding: 0.5rem; font-size: 0.75rem; color: #ccc; white-space: nowrap; z-index: 10; line-height: 1.4; font-weight: normal; }
		.muted { color: #666; font-style: italic; font-size: 0.8rem; }
	</style>
</head>
<body>
	<h1>at-mesh Whitelist</h1>
	<button class="logout btn-danger btn-sm" onclick="logout()">Logout</button>

	<div class="form-row">
		<div>
			<label>DID</label>
			<input id="new-did" placeholder="did:plc:...">
		</div>
		<div>
			<label>Notes</label>
			<input id="new-notes" placeholder="">
		</div>
		<div>
			<button onclick="addEntry()">Add</button>
		</div>
	</div>

	<table>
		<thead>
			<tr>
				<th>DID</th>
				<th>Handle</th>
				<th>WebFinger Email
					<span class="info-icon">i
						<span class="info-tooltip">Auto-generated from handle + at-mesh hostname.<br>Use this email when signing up for services like Tailscale SaaS that use WebFinger-based OIDC discovery.</span>
					</span>
				</th>
				<th>Notes</th>
				<th></th>
			</tr>
		</thead>
		<tbody id="entries"></tbody>
	</table>

	<script>
		const api = '/api/v1/whitelist';
		let editingId = null;

		async function load() {
			const resp = await fetch(api);
			if (resp.status === 401) {
				window.location.href = '/admin/login';
				return;
			}
			const entries = await resp.json();
			const tbody = document.getElementById('entries');
			tbody.innerHTML = '';
			for (const e of entries) {
				if (editingId === e.id) {
					tbody.innerHTML += renderEditRow(e);
				} else {
					tbody.innerHTML += renderRow(e);
				}
			}
		}

		function webfingerEmail(e) {
			if (!e.email) return '<span class="muted">— pending auth —</span>';
			return esc(e.email);
		}

		function renderRow(e) {
			return `<tr>
				<td>${esc(e.did)}</td>
				<td>${e.handle ? esc(e.handle) : '<span class="muted">—</span>'}</td>
				<td>${webfingerEmail(e)}</td>
				<td>${esc(e.notes)}</td>
				<td class="actions">
					<button class="btn-sm" onclick="startEdit(${e.id})">Edit</button>
					<button class="btn-sm btn-danger" onclick="del(${e.id})">Delete</button>
				</td>
			</tr>`;
		}

		function renderEditRow(e) {
			return `<tr class="edit-row">
				<td>${esc(e.did)}</td>
				<td>${e.handle ? esc(e.handle) : '<span class="muted">—</span>'}</td>
				<td>${webfingerEmail(e)}</td>
				<td><input id="edit-notes-${e.id}" value="${esc(e.notes)}"></td>
				<td class="actions">
					<button class="btn-sm" onclick="saveEdit(${e.id})">Save</button>
					<button class="btn-sm btn-danger" onclick="cancelEdit()">Cancel</button>
				</td>
			</tr>`;
		}

		function esc(s) { return s ? s.replace(/</g,'&lt;').replace(/>/g,'&gt;') : ''; }

		async function addEntry() {
			const did = document.getElementById('new-did').value.trim();
			if (!did) return alert('DID is required');
			const resp = await fetch(api, {
				method: 'POST',
				headers: {'Content-Type': 'application/json'},
				body: JSON.stringify({
					did,
					handle: '',
					email: '',
					notes: document.getElementById('new-notes').value.trim(),
				})
			});
			if (resp.status === 201) {
				document.getElementById('new-did').value = '';
				document.getElementById('new-notes').value = '';
				load();
			} else if (resp.status === 409) {
				alert('DID already exists');
			} else {
				alert('Error: ' + resp.status);
			}
		}

		function startEdit(id) { editingId = id; load(); }
		function cancelEdit() { editingId = null; load(); }

		async function saveEdit(id) {
			const resp = await fetch(`${api}/${id}`, {
				method: 'PUT',
				headers: {'Content-Type': 'application/json'},
				body: JSON.stringify({
					handle: '',
					email: '',
					notes: document.getElementById(`edit-notes-${id}`).value.trim(),
				})
			});
			if (resp.ok) { editingId = null; load(); }
			else { alert('Error: ' + resp.status); }
		}

		async function del(id) {
			if (!confirm('Delete this entry?')) return;
			const resp = await fetch(`${api}/${id}`, {method: 'DELETE'});
			if (resp.ok) load();
			else alert('Error: ' + resp.status);
		}

		async function logout() {
			await fetch('/admin/logout', {method: 'POST'});
			window.location.href = '/admin/login';
		}

		load();
	</script>
</body>
</html>
